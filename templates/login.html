<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prova de Modelagem</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e6007e;
            --primary-dark: #c20069;
            --primary-light: #ff1a96;
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --indigo: #6366f1;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.16);
            --shadow-xl: 0 24px 64px rgba(0,0,0,0.24);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f23;
            position: relative;
            overflow: hidden;
        }

        /* Premium Animated Gradient Background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(230, 0, 126, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: gradientShift 20s ease infinite;
            z-index: 1;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Animated Grid Pattern */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(230, 0, 126, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(230, 0, 126, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 30s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Premium Glass Card with Border Glow */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 24px 64px rgba(230, 0, 126, 0.1);
            padding: 56px 48px;
            position: relative;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        /* Animated Border Glow */
        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg,
                var(--primary) 0%,
                var(--purple) 50%,
                var(--indigo) 100%);
            border-radius: 28px;
            opacity: 0.3;
            filter: blur(20px);
            z-index: -1;
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 0.5; transform: scale(1.02); }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        /* Premium Logo with Glow Effect */
        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 24px rgba(230, 0, 126, 0.3));
            animation: logoFloat 4s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .login-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .login-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            line-height: 1.5;
        }

        /* Premium Alert Messages */
        .alert {
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 28px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: alertSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            border: 1px solid;
        }

        @keyframes alertSlide {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .alert-info {
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
            border-color: rgba(6, 182, 212, 0.3);
        }

        .alert i {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 19px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }

        /* Premium Glass Input Fields - Melhor Contraste */
        .form-input {
            width: 100%;
            padding: 16px 18px 16px 52px;
            font-size: 16px;
            font-weight: 500;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            backdrop-filter: blur(10px);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.18);
            box-shadow:
                0 0 0 4px rgba(230, 0, 126, 0.2),
                0 8px 24px rgba(230, 0, 126, 0.15);
            transform: translateY(-2px);
        }

        .form-input:focus ~ .input-icon {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0.12) inset !important;
            transition: background-color 5000s ease-in-out 0s;
            caret-color: #ffffff;
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 6px;
            border-radius: 6px;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }

        .password-toggle:hover {
            color: #ffffff;
            background: rgba(230, 0, 126, 0.2);
            transform: translateY(-50%) scale(1.1);
        }

        /* Premium Gradient Button */
        .btn-login {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 50%, var(--indigo) 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 12px;
            box-shadow:
                0 8px 24px rgba(230, 0, 126, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.03em;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-login:hover::before {
            transform: translateX(100%);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 32px rgba(230, 0, 126, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            background-position: 100% 0;
        }

        .btn-login:active {
            transform: translateY(-1px);
            box-shadow:
                0 4px 16px rgba(230, 0, 126, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 32px;
            position: relative;
            z-index: 2;
            font-weight: 400;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: -6px;
            margin-bottom: 24px;
        }

        /* Custom Checkbox */
        .remember-me input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
            border-radius: 6px;
        }

        .remember-me label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        /* Premium Loading Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Forgot Password Link */
        .forgot-password-link {
            text-align: center;
            margin-top: 24px;
        }

        .forgot-password-link a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .forgot-password-link a:hover {
            color: var(--primary);
            background: rgba(230, 0, 126, 0.1);
        }

        .forgot-password-link a i {
            font-size: 16px;
        }

        /* Premium Badge - Optional */
        .premium-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(230, 0, 126, 0.3);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Responsive Adjustments */
        @media (max-width: 576px) {
            .login-container {
                max-width: 100%;
                padding: 16px;
            }

            .login-card {
                padding: 40px 28px;
                border-radius: 24px;
            }

            .logo {
                width: 110px;
            }

            .login-title {
                font-size: 26px;
            }

            .login-subtitle {
                font-size: 14px;
            }

            .form-input {
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .btn-login {
                padding: 16px;
                font-size: 15px;
            }
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 20px;
            }

            .logo {
                width: 90px;
                margin-bottom: 20px;
            }

            .login-title {
                font-size: 24px;
            }

            .login-subtitle {
                font-size: 13px;
            }

            .form-label {
                font-size: 12px;
            }

            .remember-me label {
                font-size: 13px;
            }

            .footer-text {
                font-size: 12px;
                margin-top: 24px;
            }

            .forgot-password-link a {
                font-size: 13px;
            }
        }

        /* Landscape Mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 24px 0;
            }

            .login-card {
                padding: 28px 32px;
            }

            .logo {
                width: 70px;
                margin-bottom: 12px;
            }

            .logo-container {
                margin-bottom: 24px;
            }

            .login-title {
                font-size: 22px;
            }

            .login-subtitle {
                font-size: 13px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .btn-login {
                padding: 14px;
            }

            .footer-text {
                margin-top: 20px;
            }
        }

        /* Touch Devices Optimization */
        @media (hover: none) and (pointer: coarse) {
            .form-input,
            .btn-login,
            .password-toggle {
                -webkit-tap-highlight-color: rgba(230, 0, 126, 0.1);
            }

            .btn-login {
                min-height: 52px;
            }

            .form-input {
                min-height: 52px;
            }

            /* Remove hover effects on touch */
            .btn-login:hover {
                transform: none;
            }

            .form-input:focus {
                transform: none;
            }
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Dark Mode Support (future-proof) */
        @media (prefers-color-scheme: dark) {
            /* Already dark, but could adjust if needed */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/Puket.png') }}" alt="Logo Puket - Sistema de Gestão de Provas de Modelagem" class="logo" onerror="this.style.display='none'">
                <h1 class="login-title">Bem-vindo!</h1>
                <p class="login-subtitle">Sistema de Gestão de Provas de Modelagem</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">
                    <i class="bi bi-{{ 'check-circle-fill' if category == 'success' else 'exclamation-triangle-fill' if category == 'danger' or category == 'error' else 'info-circle-fill' }}"></i>
                    <span>{{ message }}</span>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="username" class="form-label">Usuário</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input no-uppercase"
                            placeholder="Seu usuário"
                            required
                            autocomplete="username"
                            autofocus
                        >
                        <i class="bi bi-person-circle input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Sua senha"
                            required
                            autocomplete="current-password"
                        >
                        <i class="bi bi-shield-lock-fill input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Mostrar/ocultar senha">
                            <i class="bi bi-eye-fill" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Manter conectado</label>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Acessar Sistema</span>
                </button>

                <div class="forgot-password-link">
                    <a href="{{ url_for('auth.esqueci_senha') }}">
                        <i class="bi bi-key-fill"></i>
                        Esqueci minha senha
                    </a>
                </div>
            </form>
        </div>

        <p class="footer-text">
            Sistema de Gestão de Provas de Modelagem © 2025
        </p>
    </div>

    <script>
        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            }
        }

        // Enhanced Form Submit with Loading State
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            btn.style.cursor = 'wait';
            btnText.innerHTML = '<span class="spinner"></span> <span style="margin-left: 8px;">Autenticando...</span>';
        });

        // Enhanced Input Animations
        document.querySelectorAll('.form-input').forEach(input => {
            // Focus animation
            input.addEventListener('focus', function() {
                this.parentElement.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                this.parentElement.style.transform = 'scale(1.01)';
            });

            // Blur animation
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });

            // Typing feedback
            input.addEventListener('input', function() {
                if (this.value.length > 0) {
                    this.style.fontWeight = '600';
                } else {
                    this.style.fontWeight = '500';
                }
            });
        });

        // Auto-focus on first empty input
        window.addEventListener('DOMContentLoaded', function() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            if (usernameInput && !usernameInput.value) {
                usernameInput.focus();
            } else if (passwordInput && !passwordInput.value) {
                passwordInput.focus();
            }
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            // Alt + L to focus on login button
            if (e.altKey && e.key === 'l') {
                e.preventDefault();
                document.getElementById('loginBtn').focus();
            }
            // Ctrl/Cmd + K to toggle password visibility
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                togglePassword();
            }
        });

        // Prevent multiple form submissions
        let isSubmitting = false;
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }
            isSubmitting = true;
        });

        // Enhanced loading spinner animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spinEnhanced {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .spinner {
                animation: spinEnhanced 0.7s linear infinite;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
